name: Aviso de lluvia

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar lluvia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STOP: "true"
        run: python rain_alert.py

      - name: Guardar estado si ha cambiado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "rain-alert-bot"
            git config user.email "rain-alert-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar estado de lluvia"
            git push
          fi
